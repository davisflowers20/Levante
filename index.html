<style>
:root{
  --tap:44px;
  --paper:#F3EFE8;
  --paper-2:#EAE5DC;
  --card:#FBF9F5;
  --sage:#E2E4DD;
  --ink:#17150F;
  --ink-2:#4A453D;
  --muted:#857E73;
  --accent:#8B6A4B;
  --accent-soft:#C7A883;
  --rule:#DCD5C8;
  --good:#5F7355;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Lato',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-weight:400;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{max-width:660px;margin:0 auto;padding:0 var(--pad)}

/* ---------- type ---------- */
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
.eyebrow.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.08;letter-spacing:-.01em}
h1{font-size:38px}
h2{font-size:26px}
h3{font-size:19px}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:8px;line-height:1.5}
.tiny{font-size:12.5px;color:var(--muted);line-height:1.5}
.hr{height:1px;background:var(--rule);border:0;margin:20px 0}
.hr.short{width:64px;height:2px;background:var(--accent-soft);margin:16px 0}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header.app-head{
  position:sticky;top:0;z-index:40;background:rgba(243,239,232,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);
}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0 10px}
.head-l{min-width:0;flex:1}
.head-title{font-family:var(--serif);font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:700}
.pts-chip{display:flex;align-items:baseline;gap:5px;background:var(--ink);color:#F3EFE8;border-radius:999px;padding:6px 13px;white-space:nowrap}
.pts-chip b{font-size:15px;font-weight:700;letter-spacing:.01em}
.pts-chip span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink-2);flex:none}

/* ---------- nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(243,239,232,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);
  padding:7px 0 calc(7px + env(safe-area-inset-bottom));
}
.tabs-in{max-width:660px;margin:0 auto;padding:0 10px;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;color:var(--muted);transition:color .18s}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{stroke-width:1.9}

/* ---------- views ---------- */
.view{display:none;padding:22px 0 40px;animation:rise .32s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px;margin-bottom:14px}
.card.flat{background:transparent;border-color:var(--rule)}
.card.sage{background:var(--sage);border-color:transparent}
.card.ink{background:var(--ink);color:var(--paper);border-color:transparent}
.card.ink .tiny,.card.ink .sub{color:rgba(243,239,232,.72)}
.card.ink .eyebrow{color:var(--accent-soft)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

/* ---------- day header ---------- */
.dayhead{padding:2px 0 4px}
.dayhead h1{margin-top:9px;font-size:34px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.datenav button{width:38px;height:38px;border:1px solid var(--rule);border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink-2)}
.datenav button:disabled{opacity:.32}
.datenav .dn-mid{flex:1;text-align:center}
.dn-date{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.dn-phase{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:3px;font-weight:700}
.badge{display:inline-block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--sage);color:var(--ink-2)}
.badge.today{background:var(--accent);color:#fff}
.badge.done{background:var(--good);color:#fff}

/* ---------- countdown ---------- */
.countdown{display:flex;align-items:baseline;gap:9px;margin-top:14px}
.countdown b{font-family:var(--serif);font-size:30px;line-height:1;font-weight:500}
.countdown span{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- exercises ---------- */
.ex{border-top:1px solid var(--rule);padding:16px 0 4px}
.ex:first-of-type{border-top:0;padding-top:4px}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ex-name{font-family:var(--serif);font-size:18.5px;line-height:1.2}
.ex-prescribe{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;white-space:nowrap;flex:none}
.ex-cue{font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.sug{display:flex;gap:8px;align-items:flex-start;margin-top:10px;background:var(--paper-2);border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.sug b{color:var(--ink);font-weight:700}
.sug.up{background:#E7EBE2}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center}
.setrow .sn{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field{position:relative}
.field input{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:11px 10px 11px 11px;font-size:16px;font-variant-numeric:tabular-nums;text-align:center;transition:border-color .15s,background .15s}
.field input:focus{border-color:var(--accent);outline:none;background:#fff}
.field label{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);pointer-events:none;font-weight:700}
.chk{height:42px;border:1px solid var(--rule);border-radius:9px;display:grid;place-items:center;background:var(--paper);transition:.16s}
.chk svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .chk{background:var(--good);border-color:var(--good)}
.setrow.done .chk svg{stroke:#fff}
.setrow.done .field input{opacity:.62}
.ex.nolog .sets{display:none}
.simple-done{margin-top:12px;display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--paper);width:100%;text-align:left}
.simple-done .chk{width:34px;height:34px;flex:none}
.simple-done span{font-size:13.5px;color:var(--ink-2)}
.simple-done.done{background:#EDF0E9;border-color:#CBD5C2}
.simple-done.done span{color:var(--good);font-weight:700}

/* ---------- posture ---------- */
.plist{margin-top:6px}
.pitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);text-align:left;width:100%}
.pitem:first-child{border-top:0}
.pbox{width:22px;height:22px;border:1.5px solid var(--rule);border-radius:6px;flex:none;display:grid;place-items:center}
.pbox svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pitem.on .pbox{background:var(--good);border-color:var(--good)}
.pitem.on .pbox svg{opacity:1}
.pitem .pn{font-size:14.5px;flex:1}
.pitem .pd{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.pitem.on .pn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}

/* ---------- metrics ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mfield{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.mfield .eyebrow{font-size:9.5px;color:var(--muted)}
.mfield input{width:100%;background:none;border:0;padding:4px 34px 0 0;font-family:var(--serif);font-size:24px;outline:none;font-variant-numeric:tabular-nums}
.mfield .unit{position:absolute;right:12px;bottom:13px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
textarea.win{width:100%;margin-top:10px;background:var(--paper);border:1px solid var(--rule);border-radius:11px;padding:12px;min-height:78px;resize:vertical;font-size:16px;line-height:1.5;outline:none}
textarea.win:focus{border-color:var(--accent)}

/* ---------- calendar ---------- */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.calhead div{text-align:center;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{aspect-ratio:1/1.52;min-height:64px;border:1px solid var(--rule);border-radius:9px;background:var(--card);padding:6px 3px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;position:relative;overflow:hidden}
.cell.empty{border:0;background:none}
.cell .cd{font-family:var(--serif);font-size:15px;line-height:1}
.cell .cl{font-size:7.8px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.12;font-weight:700}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.done{background:var(--good);border-color:var(--good)}
.dots{display:flex;gap:4px;margin-top:auto;padding-top:3px}
.dots i{width:5.5px;height:5.5px;border-radius:50%;border:1.2px solid var(--rule);display:block;background:none}
.dots i.on{background:var(--good);border-color:var(--good)}
.cell.done .dots i,.cell.done .dots i.on{background:var(--paper);border-color:var(--paper)}
.cell.event .dots i{border-color:rgba(243,239,232,.4)}
.cell.event .dots i.on{background:var(--paper);border-color:var(--paper)}
.cell.done .cd,.cell.done .cl{color:#fff}
.cell.part{background:#EDF0E9}
.cell.event{background:var(--ink)}
.cell.event .cd,.cell.event .cl{color:var(--paper)}
.cell.event.done{background:var(--good)}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.leg div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.leg i{width:10px;height:10px;border-radius:3px;display:block}

/* ---------- phases ---------- */
.phase{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--rule)}
.phase:first-of-type{border-top:0}
.phase .pi{font-family:var(--serif);font-size:22px;color:var(--accent-soft);line-height:1;width:26px;flex:none}
.phase h3{font-size:16px}

/* ---------- rewards ---------- */
.bank{text-align:center;padding:26px 18px}
.bank .bal{font-family:var(--serif);font-size:56px;line-height:1;margin:8px 0 2px}
.rw{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--rule)}
.rw:first-of-type{border-top:0}
.rw-body{flex:1;min-width:0}
.rw-name{font-size:15.5px;line-height:1.3}
.rw-cost{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:3px}
.rw-btn{border:1px solid var(--ink);border-radius:999px;padding:11px 16px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;white-space:nowrap;flex:none}
.rw-btn:disabled{border-color:var(--rule);color:var(--muted)}
.rw-btn.take{background:var(--ink);color:var(--paper)}
.rw.locked .rw-name{color:var(--muted)}
.bar{height:4px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent-soft);border-radius:99px;transition:width .5s ease}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:13px}
.ledger div:first-child{border-top:0}
.ledger .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .amt.neg{color:var(--accent)}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1;font-weight:500}
.stat span{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-top:6px}
table.trk{width:100%;border-collapse:collapse;font-size:13px}
table.trk th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:0 0 8px}
table.trk th:first-child{text-align:left}
table.trk td{padding:10px 0;border-top:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums}
table.trk td:first-child{text-align:left;font-size:13.5px}
table.trk td.no{color:var(--rule)}
.chartwrap{margin-top:10px}
svg.chart{width:100%;height:112px;display:block;overflow:visible}

/* ---------- accordion ---------- */
.acc{border-top:1px solid var(--rule)}
.acc:last-of-type{border-bottom:1px solid var(--rule)}
.acc-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;text-align:left}
.acc-btn h3{font-size:17px}
.acc-btn .arrow{width:16px;height:16px;flex:none;transition:transform .25s}
.acc.open .acc-btn .arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:0 0 18px}
.acc.open .acc-body{display:block}
.libitem{padding:13px 0;border-top:1px solid var(--rule)}
.libitem:first-child{border-top:0}
.libitem b{font-family:var(--serif);font-size:16px;font-weight:500;display:block}
.libitem span{font-size:13px;color:var(--ink-2);display:block;margin-top:4px;line-height:1.45}
.numlist{counter-reset:n;margin:0;padding:0;list-style:none}
.numlist li{counter-increment:n;position:relative;padding:12px 0 12px 34px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2);line-height:1.5}
.numlist li:first-child{border-top:0}
.numlist li:before{content:counter(n);position:absolute;left:0;top:12px;font-family:var(--serif);font-size:16px;color:var(--accent-soft)}
.timeline .tl{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--rule);align-items:baseline}
.timeline .tl:first-child{border-top:0}
.timeline .tl .t{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:700;line-height:1.4}
.timeline .tl .d{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.pack{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--rule);width:100%;text-align:left}
.pack:first-child{border-top:0}
.pack .pn{flex:1;font-size:14px}
.pack.on .pn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.warn{background:var(--sage);border-radius:11px;padding:13px 14px;font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:12px}

/* ---------- after spain ---------- */
.tmpl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-top:1px solid var(--rule)}
.tmpl:first-of-type{border-top:0}
.tmpl .tn{font-family:var(--serif);font-size:17px}
.tmpl .tt{font-size:12px;color:var(--muted);margin-top:3px}
.reflect label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:16px 0 7px;line-height:1.5}
.reflect textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:11px;min-height:62px;resize:vertical;font-size:16px;outline:none}
.reflect textarea:focus{border-color:var(--accent)}

/* ---------- rest timer ---------- */
.timer{
  position:fixed;left:50%;transform:translateX(-50%) translateY(30px);
  bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:var(--paper);border-radius:999px;
  padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;
  box-shadow:0 8px 28px rgba(23,21,15,.22);
  width:min(420px,calc(100vw - 32px));
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .34s cubic-bezier(.2,.9,.3,1),opacity .24s ease,visibility 0s linear .34s;
}
.timer.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.timer .tlab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;font-weight:700}
.timer .tnum{font-family:var(--serif);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.timer .tmid{flex:1}
.timer button{border:1px solid rgba(243,239,232,.32);border-radius:999px;padding:11px 15px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--paper)}
.timer button.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,21,15,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--paper);border-radius:20px 20px 0 0;padding:22px var(--pad) calc(26px + env(safe-area-inset-bottom));max-height:86vh;max-height:86dvh;overflow:auto;transform:translateY(101%);transition:transform .34s cubic-bezier(.2,.9,.3,1);max-width:660px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;background:var(--rule);border-radius:99px;margin:-8px auto 16px}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:11px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border:1px solid var(--ink);margin-top:10px}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule);color:var(--ink-2)}
.btn.danger{border-color:#B4553F;color:#B4553F}
.inp{width:100%;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px;font-size:16px;outline:none;margin-top:8px}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 96px;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-24px);top:calc(14px + env(safe-area-inset-top));z-index:90;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:370px){:root{--pad:16px}h1{font-size:33px}.dayhead h1{font-size:30px}.sb-t{font-size:19px}.tab span{font-size:9px}}
@media (min-width:520px){h1{font-size:44px}.dayhead h1{font-size:40px}}

/* ---------- today sections ---------- */
.sec{background:var(--card);border:1px solid var(--rule);border-radius:14px;margin-bottom:12px}
.sec.open{background:var(--card)}
.sec-btn{width:100%;display:flex;align-items:center;gap:14px;padding:18px;text-align:left}
.sb-l{flex:1;min-width:0}
.sb-t{font-family:var(--serif);font-size:21px;line-height:1.15}
.sb-s{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.sec.done .sb-s{color:var(--good)}
.sb-i{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;flex:none;color:var(--ink-2);transition:.2s}
.sb-i svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.sec.open .sb-i svg.chev{transform:rotate(180deg)}
.sec.done .sb-i{background:var(--good);border-color:var(--good);color:#fff}
.sec-body{display:none;padding:0 18px 18px}
.sec.open .sec-body{display:block;animation:rise .26s ease both}
.sec-body .ex:first-of-type{border-top:1px solid var(--rule);padding-top:16px}
.warmblock{background:var(--sage);border-radius:11px;padding:14px;margin-bottom:4px}
.finish{display:block;width:100%;text-align:center;padding:15px;border-radius:11px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;background:var(--ink);color:var(--paper);margin-top:18px}
.finish.undo{background:none;border:1px solid var(--rule);color:var(--muted)}
.bankmini{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.bankmini b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:500}
.sec-btn{min-height:var(--tap)}
.sec.tap .sb-t{font-size:19px}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:9px}
.mark{width:19px;height:19px;flex:none;fill:var(--ink)}
.wm{font-family:var(--serif);font-size:16px;letter-spacing:.22em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:40px 28px calc(40px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .5s ease}
.cover.on{opacity:1;pointer-events:auto}
.cover .mark{width:34px;height:34px;margin-bottom:26px;animation:rise .7s .1s ease both}
.cover .ce{animation:rise .7s .2s ease both}
.cover h1{font-size:56px;letter-spacing:.14em;text-transform:uppercase;line-height:.98;margin:14px 0 0;animation:rise .7s .3s ease both}
.cover .crule{width:64px;height:2px;background:var(--accent-soft);margin:26px 0;animation:rise .7s .4s ease both}
.cover .cd{font-size:15px;color:var(--ink-2);line-height:1.6;max-width:30ch;animation:rise .7s .5s ease both}
.cover .cgloss{font-size:13px;color:var(--muted);line-height:1.6;max-width:34ch;margin-top:22px;animation:rise .7s .6s ease both}
.cover .cgloss i{font-style:italic;color:var(--accent)}
.cover .cform{margin-top:auto;padding-top:36px;animation:rise .7s .7s ease both}
@media (min-width:520px){.cover h1{font-size:70px}}
</style>
</head>
<body>

<header class="app-head">
  <div class="wrap head-in">
    <div class="head-l">
      <div class="brand">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-14 50 50)"><rect x="26" y="26" width="46" height="10" rx="5"/><rect x="14" y="45" width="72" height="10" rx="5"/><rect x="34" y="64" width="30" height="10" rx="5"/></g></svg>
        <span class="wm" id="headTitle">Levante</span>
      </div>
      <div class="head-sub" id="headSub">Aug 2 – 23, 2026</div>
    </div>

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmt(s,long){const d=parse(s);return (long?DOW[d.getDay()]+', ':'')+MON[d.getMonth()]+' '+d.getDate()}

function afterState(d){ if(!S.after[d]) S.after[d]={tid:null,ex:{}}; return S.after[d] }
function setsOf(st,ex,n){ if(!st.ex[ex.id]) st.ex[ex.id]=Array.from({length:n},()=>({w:'',r:'',d:false}));
  while(st.ex[ex.id].length<n) st.ex[ex.id].push({w:'',r:'',d:false}); return st.ex[ex.id] }
function exDone(st,ex){ const a=st.ex[ex.id]; return !!a && a.slice(0,ex.sets).every(s=>s.d) }
function sessionDone(day,st){ return !!(st&&st.fin) }
function metricsFull(st){ const m=st.m||{}; return ['e','s','rpe','p'].every(k=>m[k]!==''&&m[k]!==undefined&&m[k]!==null) }
function postureDone(st){ return (st.posture||[]).filter(Boolean).length===5 }

/* ---------- history + progression ---------- */
function history(exId,beforeDate){
  const out=[];
  Object.keys(S.days).forEach(d=>{ const a=S.days[d].ex&&S.days[d].ex[exId]; if(a) out.push({d,sets:a.filter(s=>s.d)}) });
  Object.keys(S.after).forEach(d=>{ const a=S.after[d].ex&&S.after[d].ex[exId]; if(a) out.push({d,sets:a.filter(s=>s.d)}) });
  return out.filter(x=>x.sets.length && (!beforeDate||x.d<beforeDate)).sort((a,b)=>a.d<b.d?-1:1);
}
function topRep(reps){ const m=String(reps).match(/(\d+)\s*[–-]\s*(\d+)/); if(m) return +m[2]; const s=String(reps).match(/(\d+)/); return s?+s[1]:null }
function botRep(reps){ const m=String(reps).match(/(\d+)/); return m?+m[1]:null }
function suggest(ex,date){
  const meta=EX[ex.id]||{}; const h=history(ex.id,date); const last=h[h.length-1];
  if(!last){
    const seed={shoulderPress:'Warm up with 10 lb, then try 12–15 lb for work sets.',lateralRaise:'Usually 5–8 lb with strict form.',rearDelt:'Often 3–8 lb.',csRow:'The heaviest dumbbells you can control for all 10 reps.',oneArmRow:'The heaviest dumbbell you can control for all 10 reps.'}[ex.id];
    return seed?{txt:'<b>First time.</b> '+seed,up:false}:null;
  }
  const ws=last.sets.map(s=>parseFloat(s.w)).filter(n=>!isNaN(n));
  const rs=last.sets.map(s=>parseInt(s.r)).filter(n=>!isNaN(n));
  if(!ws.length){ return rs.length?{txt:'<b>Last '+fmt(last.d)+':</b> '+rs.join(', ')+' reps.',up:false}:null }
  const w=Math.max(...ws); const top=topRep(ex.reps);
  const hitTop = top && rs.length>=Math.min(last.sets.length,ex.sets) && rs.every(r=>r>=top);
  const line='<b>Last '+fmt(last.d)+':</b> '+w+' lb × '+(rs.length?rs.join(', '):'—')+'. ';
  if(hitTop && meta.inc) return {txt:line+'Every set hit the top of the range — move to <b>'+(w+meta.inc)+' lb</b> and drop back to '+botRep(ex.reps)+' reps.',up:true};
  return {txt:line+'Stay at '+w+' lb until all sets reach '+(top||'the top of the range')+'.',up:false};
}
function prefill(ex,date){
  const h=history(ex.id,date); const last=h[h.length-1];
  if(!last) return {w:'',r:''};
  const ws=last.sets.map(s=>parseFloat(s.w)).filter(n=>!isNaN(n));
  const rs=last.sets.map(s=>parseInt(s.r)).filter(n=>!isNaN(n));
  const meta=EX[ex.id]||{}; const top=topRep(ex.reps);
  let w=ws.length?Math.max(...ws):'';
  if(w!=='' && top && rs.length && rs.every(r=>r>=top) && meta.inc) w=w+meta.inc;
  return {w:w===''?'':String(w),r:''};
}

/* ---------- points ---------- */
function points(){
  let earned=0; const byDay={};
  const add=(d,n)=>{byDay[d]=(byDay[d]||0)+n;earned+=n};
  PLAN.forEach(day=>{
    const st=S.days[day.d]; if(!st) return;
    day.ex.forEach(e=>{ if(exDone(st,e)) add(day.d,10) });
    if(sessionDone(day,st)) add(day.d,30);
    if(postureDone(st)) add(day.d,15);
    if(st.ab) add(day.d,10);
    if(metricsFull(st)) add(day.d,10);
  });
  ['2026-08-02','2026-08-17'].forEach(d=>{ if(S.photos[d]) add(d,20) });
  let run=0;
  PLAN.forEach(day=>{ const st=S.days[day.d]; const ok=st&&sessionDone(day,st);
    if(ok){run++; if(run%3===0) add(day.d,25)} else run=0; });
  Object.keys(S.after).forEach(d=>{ const a=S.after[d]; if(!a.tid) return;
    if(a.fin) add(d,80);
  });
  const spent=S.redeemed.reduce((n,r)=>n+r.c,0);
  return {earned,spent,bal:earned-spent,byDay};
}
function streak(){
  let best=0,run=0;
  PLAN.filter(p=>p.d<=TODAY).forEach(day=>{ const st=S.days[day.d];
    if(st&&sessionDone(day,st)){run++;best=Math.max(best,run)}else run=0 });
  return {cur:run,best};
}

let T={left:0,iv:null};
function showTimer(sec){
  if(!sec) return;
  T.left=sec; $('#timer').classList.add('on'); paintTimer();
  clearInterval(T.iv);
  T.iv=setInterval(()=>{ T.left--; paintTimer(); if(T.left<=0){ clearInterval(T.iv); ding(); setTimeout(hideTimer,1400) } },1000);
}
function paintTimer(){ const m=Math.floor(Math.max(0,T.left)/60), s=Math.max(0,T.left)%60; $('#timerNum').textContent=T.left<=0?'Go':m+':'+String(s).padStart(2,'0') }
function hideTimer(){ clearInterval(T.iv); $('#timer').classList.remove('on') }
function ding(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.frequency.value=784;g.gain.setValueAtTime(.0001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.5);
  o.start();o.stop(c.currentTime+.52);}catch(e){} }

    renderToday(); refreshPts(); return;
  }
  if(a==='posture'){ const st=dayState(d); const i=+t.dataset.i; st.posture[i]=!st.posture[i]; save(); renderToday(); refreshPts(); return }
  if(a==='photo'){ S.photos[d]=!S.photos[d]; save(); renderToday(); renderProgress(); refreshPts(); return }
  if(a==='pack'){ const i=+t.dataset.i; S.packing[i]=!S.packing[i]; save(); openAcc.pack=true; renderGuide(); return }
  if(a==='acc'){ openAcc[t.dataset.id]=!openAcc[t.dataset.id]; renderGuide(); return }
  if(a==='startafter'){ afterState(TODAY).tid=t.dataset.tid; save(); renderToday(); window.scrollTo({top:0}); return }
  if(a==='switchafter'){ afterState(TODAY).tid=null; save(); renderToday(); return }
  if(a==='gotoafter'){ afterMode=true; afterState(TODAY).tid=t.dataset.tid; save(); go('today'); renderToday(); return }
  if(a==='editrewards'){ rewardsSheet(); return }
  if(a==='addrw'){ S.rewards.push({id:'r'+Date.now(),n:'New reward',c:250}); save(); rewardsSheet(); return }
  if(a==='delrw'){ S.rewards.splice(+t.dataset.i,1); save(); rewardsSheet(); renderRewards(); return }
  if(a==='closesheet'){ closeSheet(); renderRewards(); return }
  if(a==='redeem'){ redeemSheet(t.dataset.id); return }
  if(a==='confirmredeem'){
    const r=S.rewards.find(x=>x.id===t.dataset.id); if(!r) return;
    if(points().bal<r.c){ toast('Not enough points yet.'); closeSheet(); return }
    S.redeemed.push({n:r.n,c:r.c,d:TODAY}); save(); closeSheet(); renderRewards(); refreshPts(); toast('Claimed. Tell me and I\u2019ll make good on it.'); return;
  }
  if(a==='begin'){
    const n=$('#coverName').value.trim(); if(n) S.name=n;
    S.seen=true; save(); paintHead(); $('#cover').classList.remove('on'); return;
  }
  if(a==='savename'){ S.name=$('#setName').value.trim(); save(); paintHead(); closeSheet(); return }
  if(a==='export'){
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const link=document.createElement('a');
    link.href=url; link.download='spain-prep-backup.json'; link.click(); URL.revokeObjectURL(url); return;
  }
  if(a==='import'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
      rd.onload=()=>{ try{ S=Object.assign({},BLANK,JSON.parse(rd.result)); save(); closeSheet(); render(); toast('Backup restored.') }catch(err){ toast('That file could not be read.') } };
      rd.readAsText(f); };
    inp.click(); return;
  }
  if(a==='reset'){
    openSheet('<div class="eyebrow">Erase everything</div><h2 style="margin:8px 0 10px">This cannot be undone</h2><div class="tiny">Every logged set, every point, every claimed reward.</div><button class="btn danger" data-act="confirmreset">Erase it all</button><button class="btn ghost" data-act="closesheet">Keep my data</button>'); return;
  }
  if(a==='confirmreset'){ S=JSON.parse(JSON.stringify(BLANK)); save(); closeSheet(); cur=beforeStart?FIRST:(afterEnd?LAST:TODAY); render(); toast('Cleared.'); return }
});

$('#gearBtn').addEventListener('click',settingsSheet);
$('#timerDone').addEventListener('click',hideTimer);
$('#timerAdd').addEventListener('click',()=>{T.left+=15;paintTimer()});

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function go(name){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===name)));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+name));
  if(name==='plan')renderPlan(); if(name==='progress')renderProgress(); if(name==='rewards')renderRewards(); if(name==='guide')renderGuide();
  window.scrollTo({top:0});
}

/* =====================================================================
   INIT
   ===================================================================== */
function paintHead(){
  $('#headTitle').textContent = 'Levante';
  const left=daysBetween(TODAY,EVENT);
  $('#headSub').textContent = (S.name?S.name+' · ':'') + (left>0 ? left+' days to the party' : (left===0?'Welcome party today':'Aug 2 – 23, 2026'));
  refreshPts();
}
function render(){ paintHead(); renderToday(); renderPlan(); renderProgress(); renderRewards(); renderGuide() }
render();
if(!S.seen){ $('#cover').classList.add('on') }
</script>
</body>
</html>
